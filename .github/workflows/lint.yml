name: Lint

# `npm run dev` is esbuild-watch, which strips types without checking them — a
# broken build compiles happily and only fails once Foundry loads it. This job
# is the typecheck that development doesn't do.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint
